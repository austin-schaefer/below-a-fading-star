<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Below a Fading Star: the swollen sun sitting in its saddle of rock -->
  <defs>
    <radialGradient id="sun" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#ffb26a"/>
      <stop offset="0.45" stop-color="#e8591a"/>
      <stop offset="0.82" stop-color="#9a1e10"/>
      <stop offset="1" stop-color="#5a0c0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#e8591a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8591a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0609"/>
  <circle cx="32" cy="30" r="30" fill="url(#glow)"/>
  <circle cx="32" cy="30" r="17" fill="url(#sun)"/>
