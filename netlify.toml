# Netlify config for Below a Fading Star. The site has no base directory set; paths are relative to the
# repository root.
[build]
  # Only what the page loads is published: the build copies it into _site/, so docs, briefs, tools, skills
  # and the screenshot archive never reach the CDN. commit.json carries the short commit hash, so a bench
  # run on the site names its commit, and _headers stamps every response with it (X-Fp-Commit): the service
  # worker (sw.js, v13-L1) keeps a file only under the commit its own response names, so it cannot mix releases.
  publish = "_site"
  command = 'rm -rf _site && mkdir _site && cp -R index.html listen.html sw.js src vendor favicon-32.png apple-touch-icon.png _site/ && printf "{\"commit\":\"%s\"}" "${COMMIT_REF:0:7}" > _site/commit.json && printf "/*\n  X-Fp-Commit: %s\n" "${COMMIT_REF:0:7}" > _site/_headers'
  # Build only when something the site serves changed. Netlify bills by the build, and most commits here
  # are docs, briefs, tools and tests. Exit 0 skips the build (Netlify's ignore contract). Runs against the
  # last successfully built commit. A new top-level file the page loads goes in both lists.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html listen.html sw.js src vendor netlify.toml favicon-32.png apple-touch-icon.png"

[[headers]]
  for = "/*"
  [headers.values]
    # A prototype, not for search engines.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The page needs none of these; pointer lock, fullscreen and audio are not governed here.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# The service worker and the commit it checks on every navigation are revalidated every time, so a release reaches
# a returning visitor on their next navigation (sw.js, DEPLOY.md "The service worker").
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/commit.json"
  [headers.values]
    Cache-Control = "no-cache"
