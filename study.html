<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Sheets</title>
<meta name="robots" content="noindex, nofollow">
<!-- The study page (#77): every figure and creature side by side, close and moving, and the recipes at six seeds.
     A dev page: nothing in the walk links here or loads src/study/. Params and keys: src/study/main.js's header. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
<style>
  :root { --bg: #17141c; --ink: #e8e0d0; --dim: #9a917f; --bad: #ff7a5c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 12px/1.3 ui-monospace, Menlo, monospace; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lab { position: absolute; padding: 3px 6px; background: rgba(12, 10, 16, 0.62); border-bottom-right-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab b { font-weight: 600; }
  .lab i { font-style: normal; color: var(--dim); }
  .lab.bad { color: var(--bad); white-space: normal; }
  #bar { position: fixed; right: 0; bottom: 0; padding: 4px 8px; background: rgba(12, 10, 16, 0.7); color: var(--dim); }
  #bar a { color: var(--ink); margin-left: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="bar"></div>
<script type="module" src="./src/study/main.js"></script>
</body>
</html>
